<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>María Alejandra Rojas — Portafolio de Arquitectura</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body { 
            width: 100%;
            height: 100%;
            background-color: #121212; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            color: #ffffff; 
            overflow: hidden; 
            display: flex;
            flex-direction: column;
        }

        /* Encabezado superior superior elegante */
        header {
            width: 100%;
            height: 65px;
            padding: 0 40px;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .brand-info {
            display: flex;
            flex-direction: column;
        }

        .brand-name {
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #ffffff;
        }

        .brand-subtitle {
            font-size: 0.75rem;
            color: #a0a0a0;
            margin-top: 2px;
            letter-spacing: 0.5px;
        }

        .btn-download-top {
            background: #ffffff;
            color: #000000;
            padding: 8px 18px;
            border-radius: 6px;
            font-size: 0.82rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn-download-top:hover {
            background: #e0e0e0;
            transform: translateY(-1px);
        }

        /* Área central del libro */
        .main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 20px 40px 10px 40px;
        }

        .book-stage {
            width: 100%;
            height: calc(100vh - 160px);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .flipbook-container { 
            position: relative; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.8); 
            display: none; 
            margin: 0 auto;
        }

        #loading { 
            font-size: 0.9rem; 
            color: #888888; 
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Controles inferiores navegables */
        .controls { 
            height: 50px;
            display: flex; 
            align-items: center;
            gap: 12px; 
            z-index: 10; 
            margin-top: 10px;
        }

        .btn-nav { 
            background: rgba(255,255,255,0.08); 
            border: 1px solid rgba(255,255,255,0.15); 
            color: #e0e0e0; 
            padding: 8px 22px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 0.85rem;
            transition: background 0.2s, color 0.2s; 
            -webkit-tap-highlight-color: transparent;
        }

        .btn-nav:hover { 
            background: rgba(255,255,255,0.18); 
            color: #ffffff;
        }

        /* Pie de página sutil */
        footer {
            height: 35px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.72rem;
            color: #555555;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
        }

        .page { 
            background-color: #ffffff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden; 
        }

        canvas { 
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
        }

        @media (max-width: 600px) {
            header { padding: 0 20px; }
            .brand-name { font-size: 0.85rem; }
            .brand-subtitle { font-size: 0.7rem; }
            .btn-download-top { padding: 6px 12px; font-size: 0.75rem; }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
</head>
<body>

    <header>
        <div class="brand-info">
            <span class="brand-name">María Alejandra Rojas</span>
            <span class="brand-subtitle">Portafolio de Arquitectura</span>
        </div>
        <a href="portafolio.pdf" download="Portafolio_Maria_Alejandra_Rojas.pdf" class="btn-download-top">Descargar PDF</a>
    </header>

    <div class="main-wrapper">
        <div id="loading">Cargando portafolio...</div>
        <div class="book-stage">
            <div id="book" class="flipbook-container"></div>
        </div>
        <div class="controls" id="controls" style="display: none;">
            <button class="btn-nav" id="prev-btn">← Anterior</button>
            <button class="btn-nav" id="next-btn">Siguiente →</button>
        </div>
    </div>

    <footer>
        © 2026 María Alejandra Rojas — Portafolio de Arquitectura
    </footer>

    <script>
        const pdfUrl = 'portafolio.pdf';

        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        const bookContainer = document.getElementById('book');
        const loadingEl = document.getElementById('loading');
        const controlsEl = document.getElementById('controls');

        async function initFlipbook() {
            try {
                const loadingTask = pdfjsLib.getDocument(pdfUrl);
                const pdf = await loadingTask.promise;
                const firstPage = await pdf.getPage(1);
                const viewport = firstPage.getViewport({ scale: 2.0 });

                const pageWidth = viewport.width;
                const pageHeight = viewport.height;

                for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                    const page = await pdf.getPage(pageNum);
                    const pageViewport = page.getViewport({ scale: 2.0 });
                    const pageDiv = document.createElement('div');
                    pageDiv.className = 'page';
                    
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.height = pageViewport.height;
                    canvas.width = pageViewport.width;
                    
                    await page.render({ canvasContext: context, viewport: pageViewport }).promise;
                    pageDiv.appendChild(canvas);
                    bookContainer.appendChild(pageDiv);
                }

                loadingEl.style.display = 'none';
                bookContainer.style.display = 'block';
                controlsEl.style.display = 'flex';

                const isMobilePortrait = window.innerWidth < 768 && window.innerHeight > window.innerWidth;

                const pageFlip = new St.PageFlip(bookContainer, {
                    width: pageWidth,
                    height: pageHeight,
                    size: "stretch",
                    minWidth: 200,
                    maxWidth: 1200,
                    minHeight: 300,
                    maxHeight: 1400,
                    showCover: true,
                    usePortrait: isMobilePortrait,
                    startPage: 0,
                    drawShadow: true,
                    maxShadowOpacity: 0.5,
                    showPageCorners: true,
                    mobileScrollSupport: false
                });

                pageFlip.loadFromHTML(document.querySelectorAll('.page'));

                document.getElementById('prev-btn').addEventListener('click', () => pageFlip.flipPrev());
                document.getElementById('next-btn').addEventListener('click', () => pageFlip.flipNext());

            } catch (error) {
                loadingEl.textContent = 'Error al cargar el portafolio. Revisa que el archivo PDF esté disponible.';
                console.error(error);
            }
        }

        initFlipbook();
    </script>
</body>
</html>
