<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portafolio de Arquitectura — María Rojas</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: #1a1a1a; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            color: #fff; 
            overflow: hidden; 
            touch-action: manipulation;
        }
        
        .main-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
            padding: 15px;
        }

        .flipbook-container { 
            position: relative; 
            box-shadow: 0 15px 40px rgba(0,0,0,0.7); 
            display: none; 
            margin: 0 auto;
        }

        #loading { 
            font-size: 1rem; 
            color: #d1d1d1; 
            letter-spacing: 0.5px;
        }

        .controls { 
            margin-top: 15px; 
            display: flex; 
            gap: 12px; 
            z-index: 10; 
        }

        .btn { 
            background: rgba(255,255,255,0.12); 
            border: 1px solid rgba(255,255,255,0.25); 
            color: #fff; 
            padding: 8px 18px; 
            border-radius: 20px; 
            cursor: pointer; 
            font-size: 0.85rem;
            backdrop-filter: blur(5px);
            transition: background 0.2s, transform 0.1s; 
            -webkit-tap-highlight-color: transparent;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn:hover { 
            background: rgba(255,255,255,0.25); 
        }

        .page { 
            background-color: #fff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden; 
        }

        canvas { 
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
</head>
<body>
    <div class="main-wrapper">
        <div id="loading">Cargando portafolio...</div>
        <div id="book" class="flipbook-container"></div>
        <div class="controls" id="controls" style="display: none;">
            <button class="btn" id="prev-btn">◀ Anterior</button>
            <button class="btn" id="next-btn">Siguiente ▶</button>
        </div>
    </div>

    <script>
        // Nombre del archivo PDF subido a GitHub
        const pdfUrl = 'portafolio.pdf';

        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        const bookContainer = document.getElementById('book');
        const loadingEl = document.getElementById('loading');
        const controlsEl = document.getElementById('controls');

        async function initFlipbook() {
            try {
                const loadingTask = pdfjsLib.getDocument(pdfUrl);
                const pdf = await loadingTask.promise;
                const firstPage = await pdf.getPage(1);
                const viewport = firstPage.getViewport({ scale: 1.5 });

                const pageWidth = viewport.width;
                const pageHeight = viewport.height;
                const aspectRatio = pageWidth / pageHeight;

                for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                    const page = await pdf.getPage(pageNum);
                    const pageViewport = page.getViewport({ scale: 1.5 });
                    const pageDiv = document.createElement('div');
                    pageDiv.className = 'page';
                    
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.height = pageViewport.height;
                    canvas.width = pageViewport.width;
                    
                    await page.render({ canvasContext: context, viewport: pageViewport }).promise;
                    pageDiv.appendChild(canvas);
                    bookContainer.appendChild(pageDiv);
                }

                loadingEl.style.display = 'none';
                bookContainer.style.display = 'block';
                controlsEl.style.display = 'flex';

                // Detección de dispositivo y orientación
                const screenWidth = window.innerWidth;
                const screenHeight = window.innerHeight;
                const isMobilePortrait = screenWidth < 768 && screenHeight > screenWidth;

                let calcHeight, calcWidth, usePortraitMode;

                if (isMobilePortrait) {
                    // Teléfono en vertical: 1 sola página grande
                    calcWidth = Math.min(screenWidth * 0.88, 450);
                    calcHeight = calcWidth / aspectRatio;
                    usePortraitMode = true;
                } else {
                    // Computadora o teléfono horizontal: Muestra 2 páginas lado a lado (Libro)
                    calcHeight = Math.min(screenHeight * 0.78, 750);
                    calcWidth = calcHeight * aspectRatio;
                    usePortraitMode = false; // Fuerza el modo de 2 páginas desplegadas
                }

                const pageFlip = new St.PageFlip(bookContainer, {
                    width: Math.round(calcWidth),
                    height: Math.round(calcHeight),
                    size: "fixed",
                    minWidth: 150,
                    maxWidth: 1000,
                    minHeight: 250,
                    maxHeight: 1200,
                    showCover: true,             // Portada sola al inicio
                    usePortrait: usePortraitMode, // En PC activa modo 2 páginas obligatoriamente
                    startPage: 0,
                    drawShadow: true,
                    maxShadowOpacity: 0.5,
                    showPageCorners: true,
                    mobileScrollSupport: false
                });

                pageFlip.loadFromHTML(document.querySelectorAll('.page'));

                document.getElementById('prev-btn').addEventListener('click', () => pageFlip.flipPrev());
                document.getElementById('next-btn').addEventListener('click', () => pageFlip.flipNext());

            } catch (error) {
                loadingEl.textContent = 'Error al cargar el portafolio. Verifica que el archivo PDF esté en el repositorio.';
                console.error(error);
            }
        }

        initFlipbook();
    </script>
</body>
</html>
