<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portafolio de Arquitectura — María Rojas</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { 
            width: 100%;
            height: 100%;
            background-color: #1a1a1a; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            color: #fff; 
            overflow: hidden; 
        }
        
        .main-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
            padding: 20px;
        }

        .book-stage {
            width: 100%;
            max-width: 1200px;
            height: calc(100vh - 100px);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .flipbook-container { 
            position: relative; 
            box-shadow: 0 15px 40px rgba(0,0,0,0.7); 
            display: none; 
            margin: 0 auto;
        }

        #loading { 
            font-size: 1rem; 
            color: #d1d1d1; 
            letter-spacing: 0.5px;
        }

        .controls { 
            height: 50px;
            display: flex; 
            align-items: center;
            gap: 15px; 
            z-index: 10; 
        }

        .btn { 
            background: rgba(255,255,255,0.12); 
            border: 1px solid rgba(255,255,255,0.25); 
            color: #fff; 
            padding: 8px 20px; 
            border-radius: 20px; 
            cursor: pointer; 
            font-size: 0.9rem;
            backdrop-filter: blur(5px);
            transition: background 0.2s, transform 0.1s; 
            -webkit-tap-highlight-color: transparent;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn:hover { 
            background: rgba(255,255,255,0.25); 
        }

        .page { 
            background-color: #fff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden; 
        }

        canvas { 
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
</head>
<body>
    <div class="main-wrapper">
        <div id="loading">Cargando portafolio...</div>
        <div class="book-stage">
            <div id="book" class="flipbook-container"></div>
        </div>
        <div class="controls" id="controls" style="display: none;">
            <button class="btn" id="prev-btn">◀ Anterior</button>
            <button class="btn" id="next-btn">Siguiente ▶</button>
        </div>
    </div>

    <script>
        const pdfUrl = 'portafolio.pdf';

        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        const bookContainer = document.getElementById('book');
        const loadingEl = document.getElementById('loading');
        const controlsEl = document.getElementById('controls');

        async function initFlipbook() {
            try {
                const loadingTask = pdfjsLib.getDocument(pdfUrl);
                const pdf = await loadingTask.promise;
                const firstPage = await pdf.getPage(1);
                const viewport = firstPage.getViewport({ scale: 2.0 });

                const pageWidth = viewport.width;
                const pageHeight = viewport.height;

                for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                    const page = await pdf.getPage(pageNum);
                    const pageViewport = page.getViewport({ scale: 2.0 });
                    const pageDiv = document.createElement('div');
                    pageDiv.className = 'page';
                    
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.height = pageViewport.height;
                    canvas.width = pageViewport.width;
                    
                    await page.render({ canvasContext: context, viewport: pageViewport }).promise;
                    pageDiv.appendChild(canvas);
                    bookContainer.appendChild(pageDiv);
                }

                loadingEl.style.display = 'none';
                bookContainer.style.display = 'block';
                controlsEl.style.display = 'flex';

                const isMobilePortrait = window.innerWidth < 768 && window.innerHeight > window.innerWidth;

                const pageFlip = new St.PageFlip(bookContainer, {
                    width: pageWidth,
                    height: pageHeight,
                    size: "stretch",             // Hace que el libro se adapte automáticamente al contenedor
                    minWidth: 200,
                    maxWidth: 1200,
                    minHeight: 300,
                    maxHeight: 1400,
                    showCover: true,             // Portada sola en el centro al inicio
                    usePortrait: isMobilePortrait, // En teléfonos 1 página, en computadora 2 páginas
                    startPage: 0,
                    drawShadow: true,
                    maxShadowOpacity: 0.5,
                    showPageCorners: true,
                    mobileScrollSupport: false
                });

                pageFlip.loadFromHTML(document.querySelectorAll('.page'));

                document.getElementById('prev-btn').addEventListener('click', () => pageFlip.flipPrev());
                document.getElementById('next-btn').addEventListener('click', () => pageFlip.flipNext());

            } catch (error) {
                loadingEl.textContent = 'Error al cargar el portafolio. Revisa que el archivo PDF esté en el repositorio.';
                console.error(error);
            }
        }

        initFlipbook();
    </script>
</body>
</html>
